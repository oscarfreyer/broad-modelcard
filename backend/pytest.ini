[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra
markers =
    slow: latency budget tests on the full store (run by default; deselect with -m "not slow")
filterwarnings =
    # Starlette 1.x prefers httpx2 for its TestClient and still uses an anyio
    # alias that anyio 4.15 deprecates. Both are third-party and harmless here.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated
